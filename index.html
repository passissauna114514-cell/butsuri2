<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定期考査 過去問題録</title>
    <!-- 明朝体・楷書・オールド明朝・等幅フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Klee+One:wght@600&family=Shippori+Mincho:wght@400;600;700&family=Zen+Old+Mincho:wght@600;700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ── ① 一般閲覧用：和紙ベージュ ── */
        body[data-role="viewer"] {
            --font-main: 'Shippori Mincho', serif;
            --bg: #f7f6f2;
            --surface: #ffffff;
            --surface-sub: #f0eee6;
            --border: #dcd8cd;
            --border-dark: #8c857b;
            --text-main: #23221e;
            --text-sub: #68645d;
            --accent: #1e3a8a;
            --ans-color: #065f46;
            --split-color: #4b5563;
            --highlight: #f2f4f8;
            --error-color: #991b1b;
            --role-color: #68645d;
            --card-bg: #fcfbfa;
            --sidebar-bg: #ffffff;
        }

        /* ── ② 管理者用：藍夜ダーク ── */
        body[data-role="admin"] {
            --font-main: 'Shippori Mincho', serif;
            --bg: #0a0f1d;
            --surface: #11182c;
            --surface-sub: #18223d;
            --border: #233354;
            --border-dark: #3b5282;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --ans-color: #34d399;
            --split-color: #94a3b8;
            --highlight: #1e293b;
            --error-color: #f87171;
            --role-color: #38bdf8;
            --admin-btn: #38bdf8;
            --card-bg: #151f38;
            --sidebar-bg: #11182c;
        }

        /* ── ③ 物理部用：大正レトロ 深緑×焦茶×金古美 ── */
        body[data-role="physics"] {
            --font-main: 'Zen Old Mincho', 'Klee One', 'Shippori Mincho', serif;
            --bg: #0b1410;               /* 深緑黒 */
            --surface: #122019;          /* 深緑 */
            --surface-sub: #1a2c24;
            --border: #3b2c1a;           /* 焦茶 */
            --border-dark: #6e5231;      /* 飴色木枠 */
            --text-main: #ebdcc9;        /* 古紙色 */
            --text-sub: #a49783;         /* 枯れインク */
            --accent: #c49a45;           /* 真鍮金古美 */
            --ans-color: #4ade80;
            --split-color: #c49a45;
            --highlight: #1e332a;
            --error-color: #e11d48;
            --role-color: #c49a45;
            --admin-btn: #c49a45;
            --card-bg: #172820;
            --sidebar-bg: #122019;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main, 'Shippori Mincho', serif);
        }

        body.protect-mode {
            user-select: none;
            -webkit-user-select: none;
        }

        @media print {
            body.protect-mode {
                display: none !important;
            }
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 16px 80px 16px;
            transition: background-color 0.25s, color 0.25s;
        }

        /* ── 認証画面 ── */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #f7f6f2;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid #8c857b;
            padding: 36px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center;
            color: #23221e;
        }

        .auth-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: #68645d;
            border: 1px solid #dcd8cd;
            padding: 2px 8px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .auth-card h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .auth-card p {
            font-size: 0.8rem;
            color: #68645d;
            margin-bottom: 24px;
        }

        .auth-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #8c857b;
            background: #f7f6f2;
            color: #23221e;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 0.15em;
            outline: none;
            margin-bottom: 12px;
        }

        .auth-input:focus {
            border-color: #1e3a8a;
        }

        .auth-btn {
            width: 100%;
            background: #23221e;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .auth-btn:hover {
            opacity: 0.85;
        }

        .auth-error {
            color: #991b1b;
            font-size: 0.78rem;
            margin-top: 10px;
            display: none;
        }

        /* ── メインコンテナ ── */
        .container {
            width: 100%;
            max-width: 960px;
            display: none;
        }

        header {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .meta-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .counter-badge {
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid var(--border-dark);
            padding: 1px 6px;
            font-weight: 600;
        }

        .ver-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            border: 1px solid var(--border);
            padding: 1px 6px;
        }

        .header-title-wrap {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .role-tag {
            font-family: var(--font-main);
            font-size: 0.75rem;
            padding: 2px 8px;
            border: 1px solid var(--role-color);
            color: var(--role-color);
            margin-left: 8px;
            vertical-align: middle;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .countdown-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: var(--surface);
            border: 1px solid var(--border-dark);
            padding: 4px 10px;
            cursor: pointer;
            display: inline-flex;
            gap: 6px;
            align-items: baseline;
        }

        .countdown-chip strong {
            color: var(--accent);
            font-size: 0.95rem;
        }

        .btn-theme {
            background: var(--surface);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-theme:hover {
            background: var(--text-main);
            color: var(--surface);
        }

        /* ── 最近閲覧した履歴 ── */
        .recent-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .recent-label {
            font-weight: 600;
            color: var(--text-sub);
            flex-shrink: 0;
            font-size: 0.75rem;
        }

        .recent-items {
            display: flex;
            gap: 6px;
        }

        .recent-chip {
            background: var(--surface-sub);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: border-color 0.15s;
        }

        .recent-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Controls (Search / Filters) ── */
        .filter-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-main-row {
            display: grid;
            grid-template-columns: 140px 140px 1fr;
            gap: 8px;
        }

        @media (max-width: 640px) {
            .filter-main-row {
                grid-template-columns: 1fr 1fr;
            }
            .search-input-wrap {
                grid-column: span 2;
            }
        }

        .filter-select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-dark);
            background: var(--bg);
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-dark);
            background: var(--bg);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus, .filter-select:focus {
            border-color: var(--accent);
        }

        .filter-sub-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-group-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            width: 50px;
            flex-shrink: 0;
        }

        .filter-chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            font-size: 0.78rem;
            padding: 3px 9px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-chip:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .filter-chip.active {
            background: var(--text-main);
            border-color: var(--text-main);
            color: var(--bg);
            font-weight: 600;
        }

        .panel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-sub);
            border-top: 1px dashed var(--border);
            padding-top: 10px;
            margin-top: 4px;
        }

        .action-link {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            margin-left: 8px;
            border-bottom: 1px dotted var(--accent);
        }

        /* ── Exam Accordion Section ── */
        .exam-section {
            border: 1px solid var(--border);
            background: var(--surface);
            margin-bottom: 16px;
        }

        .exam-section[open] summary {
            border-bottom: 1px solid var(--border);
            background: var(--surface-sub);
        }

        summary {
            padding: 14px 18px;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: 600;
            transition: background 0.15s;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
        }

        .section-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: normal;
        }

        .toggle-icon {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .file-table {
            width: 100%;
        }

        .file-item-wrap {
            border-bottom: 1px solid var(--border);
        }
        .file-item-wrap:last-child {
            border-bottom: none;
        }

        .file-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            gap: 12px;
            transition: background-color 0.15s;
        }

        .file-row:hover {
            background-color: var(--highlight);
        }

        .row-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .row-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .subj-tag {
            font-size: 0.7rem;
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 2px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .subj-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .view-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 9px;
            border: 1px solid var(--border-dark);
            background: var(--surface);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            text-decoration: none;
            display: inline-block;
        }

        .btn-memo-toggle {
            color: var(--text-sub);
            border-color: var(--border);
            background: var(--bg);
        }
        .btn-memo-toggle.has-data {
            color: var(--accent);
            border-color: var(--accent);
            font-weight: bold;
        }

        .btn-question {
            color: var(--accent);
            border-color: var(--accent);
        }
        .btn-question:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-answer {
            color: var(--ans-color);
            border-color: var(--ans-color);
        }
        .btn-answer:hover {
            background: var(--ans-color);
            color: var(--bg);
        }

        .btn-split {
            color: var(--split-color);
            border-color: var(--border-dark);
            background: var(--surface-sub);
        }
        .btn-split:hover {
            background: var(--text-main);
            color: var(--surface);
        }

        .btn-download {
            color: var(--admin-btn);
            border-color: var(--admin-btn);
            background: var(--surface);
            display: none;
        }
        .btn-download:hover {
            background: var(--admin-btn);
            color: var(--bg);
        }

        body.has-download-privilege .btn-download {
            display: inline-block;
        }

        /* ── 個人演習カルテ（メモ枠） ── */
        .memo-drawer {
            display: none;
            background: var(--card-bg);
            border-top: 1px dashed var(--border);
            padding: 12px 16px;
        }
        .memo-drawer.open {
            display: block;
        }

        .memo-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            font-size: 0.78rem;
        }

        .memo-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .memo-score-input {
            width: 50px;
            padding: 2px 6px;
            border: 1px solid var(--border-dark);
            background: var(--surface);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
            font-size: 0.85rem;
        }

        .memo-status-select {
            padding: 2px 6px;
            border: 1px solid var(--border-dark);
            background: var(--surface);
            color: var(--text-main);
            font-size: 0.75rem;
        }

        .memo-date-stamp {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-sub);
            font-size: 0.72rem;
        }

        .memo-textarea {
            width: 100%;
            min-height: 54px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
            font-size: 0.82rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }
        .memo-textarea:focus {
            border-color: var(--accent);
        }

        /* ── プレビューモーダル & 引き出しサイドバー ── */
        .viewer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        .viewer-modal.open {
            display: flex;
        }

        .viewer-header {
            background: var(--surface);
            border: 1px solid var(--border-dark);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
            gap: 8px;
            flex-wrap: wrap;
        }

        .viewer-title {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .viewer-layout-wrap {
            flex: 1;
            display: flex;
            position: relative;
            min-height: 0;
            gap: 8px;
            overflow: hidden;
        }

        .viewer-body {
            flex: 1;
            display: grid;
            gap: 8px;
            min-height: 0;
            transition: margin-right 0.25s ease;
        }

        .viewer-modal.single-mode .viewer-body {
            grid-template-columns: 1fr;
        }
        .viewer-modal.single-mode #paneRight {
            display: none;
        }

        .viewer-modal.split-mode .viewer-body {
            grid-template-columns: 1fr 1fr;
        }
        .viewer-modal.split-mode #paneRight {
            display: flex;
        }

        @media (max-width: 768px) {
            .viewer-modal.split-mode .viewer-body {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        .pane-wrap {
            background: #fff;
            border: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .pane-header {
            background: var(--surface-sub);
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }

        .pane-wrap iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── PDF手書き描画オーバーレイ ── */
        .pdf-draw-canvas {
            position: absolute;
            top: 31px; /* pane-headerの下 */
            left: 0;
            width: 100%;
            height: calc(100% - 31px);
            pointer-events: none; /* OFF時はPDF操作を妨げない */
            z-index: 10;
        }
        .draw-mode-active .pdf-draw-canvas {
            pointer-events: auto; /* ON時は描画可能 */
            cursor: crosshair;
        }

        /* ── 演習ツール引き出し（サイドバー） ── */
        .viewer-sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            z-index: 30;
            transform: translateX(105%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 16px rgba(0,0,0,0.3);
            padding: 14px;
            gap: 14px;
            overflow-y: auto;
        }

        .viewer-sidebar.open {
            transform: translateX(0);
        }

        .sidebar-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            margin-bottom: 8px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* サイドバー内タイマー */
        .sidebar-timer {
            background: var(--surface-sub);
            border: 1px solid var(--border);
            padding: 12px;
            text-align: center;
        }

        .sidebar-timer-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .sidebar-timer-controls {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        /* 手書きペンパレット */
        .draw-palette {
            display: flex;
            gap: 6px;
            align-items: center;
            background: var(--surface-sub);
            padding: 6px 10px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.active {
            border-color: var(--text-main);
            transform: scale(1.15);

            badge.textContent = "管理者";
            title.innerHTML = `定期考査 過去問題録 <span id="roleBadge" class="role-tag">管理者</span>`;
            recentLabel.textContent = "最近の閲覧:";
            verBadge.textContent = "v1.0.0";
        } else if (currentUserRole === "physics") {
            document.body.classList.add("has-download-privilege");
            document.body.classList.remove("protect-mode");
            badge.textContent = "物理部";
            title.innerHTML = `定期考査 過去問録 <span id="roleBadge" class="role-tag">物理部</span>`;
            recentLabel.textContent = "最近ノ閱覽:";
            verBadge.textContent = "第壱版 (v1.0.0)";
        } else {
            document.body.classList.remove("has-download-privilege");
            document.body.classList.add("protect-mode");
            badge.textContent = "一般閲覧";
            title.innerHTML = `定期考査 過去問題録 <span id="roleBadge" class="role-tag">一般閲覧</span>`;
            recentLabel.textContent = "最近の閲覧:";
            verBadge.textContent = "v1.0.0";
        }

        document.getElementById("authScreen").style.display = "none";
        document.getElementById("mainContainer").style.display = "block";

        fetchGlobalVisitorCount();
        loadState();
        renderArchive();
    }

    document.getElementById("authSubmitBtn").addEventListener("click", () => {
        attemptAuth(document.getElementById("passwordInput").value);
    });
    document.getElementById("authForm").addEventListener("submit", (e) => {
        e.preventDefault();
        attemptAuth(document.getElementById("passwordInput").value);
    });

    document.getElementById("lockBtn").addEventListener("click", () => {
        sessionStorage.removeItem("exam_auth_role");
        location.reload();
    });

    /* ═══════════════════════════════════════════════════════════════════
       🌐 本物のグローバル同期アクセスカウンター
       ═══════════════════════════════════════════════════════════════════ */
    async function fetchGlobalVisitorCount() {
        const display = document.getElementById("visitorCount");
        const uniqueKey = "kakomon_archive_portal_2025_prod_v1";

        try {
            const res = await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${uniqueKey}`);
            const data = await res.json();
            if (data && data.value) {
                display.textContent = Number(data.value).toLocaleString();
            } else {
                display.textContent = "1";
            }
        } catch (e) {
            display.textContent = "1";
        }
    }

    /* ═══════════════════════════════════════════════════════════════════
       📝 アーカイブ & 個人演習カルテ機能
       ═══════════════════════════════════════════════════════════════════ */
    const STORAGE_KEY = "exam_portal_store";
    const MEMO_STORAGE_KEY = "exam_portal_user_memos";

    let state = {
        targetDate: "",
        recent: []
    };

    let userMemos = {};

    function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try { state = Object.assign(state, JSON.parse(raw)); } catch(e){}
        }
        const rawMemos = localStorage.getItem(MEMO_STORAGE_KEY);
        if (rawMemos) {
            try { userMemos = JSON.parse(rawMemos); } catch(e){}
        }
        renderRecent();
        updateCountdown();
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function saveMemos() {
        localStorage.setItem(MEMO_STORAGE_KEY, JSON.stringify(userMemos));
    }

    function addRecent(title, qFile, aFile) {
        state.recent = state.recent.filter(r => r.qFile !== qFile);
        state.recent.unshift({ title, qFile, aFile });
        if (state.recent.length > 3) state.recent.pop();
        saveState();
        renderRecent();
    }

    function renderRecent() {
        const bar = document.getElementById("recentBar");
        const list = document.getElementById("recentItems");
        if (!state.recent || state.recent.length === 0) {
            bar.style.display = "none";
            return;
        }
        bar.style.display = "flex";
        const tag = currentUserRole === "physics" ? "閱覽" : "閲覧";
        list.innerHTML = state.recent.map(r => `
            <div class="recent-chip" onclick="openSplitViewer('${r.title}', '${r.qFile}', '${r.aFile}')">
                <span>[${tag}]</span> ${r.title}
            </div>
        `).join("");
    }

    let selectedYear = "2025";
    let selectedGrade = "1";
    let selectedTerm = "all";
    let selectedCat = "all";
    let searchKeyword = "";

    function renderArchive() {
        const root = document.getElementById("archiveRoot");
        root.innerHTML = "";

        let matchCount = 0;

        archiveData.forEach((section, idx) => {
            if (selectedYear !== "all" && section.year !== selectedYear) return;
            if (selectedGrade !== "all" && section.grade !== selectedGrade) return;
            if (selectedTerm !== "all" && section.term !== selectedTerm) return;

            const matchedItems = section.items.filter(item => {
                const matchQuery = item.name.includes(searchKeyword);
                const matchCat = (selectedCat === "all") || (item.cat === selectedCat);
                return matchQuery && matchCat;
            });

            if (matchedItems.length === 0) return;
            matchCount += matchedItems.length;

            const details = document.createElement("details");
            details.className = "exam-section";
            if (idx === 0 || selectedTerm !== "all") details.open = true;

            const summary = document.createElement("summary");
            const sectionDisplayName = (currentUserRole === "physics" && section.nameOld) ? section.nameOld : section.name;

            summary.innerHTML = `
                <div class="section-title">
                    <span>${sectionDisplayName}</span>
                    <span class="section-count">[ ${matchedItems.length} 項目 ]</span>
                </div>
                <span class="toggle-icon">開閉 ＋/－</span>
            `;
            details.appendChild(summary);

            const table = document.createElement("div");
            table.className = "file-table";

            matchedItems.forEach(item => {
                const memo = userMemos[item.id] || { score: "", status: "未着手", date: "", text: "" };
                const hasData = Boolean(memo.score || memo.text || (memo.status && memo.status !== "未着手"));

                const memoBtnLabel = currentUserRole === "physics" ? "日誌" : "カルテ";
                const memoDrawerTitle = currentUserRole === "physics" ? "【 實驗・演習日誌 】" : "【 個人演習カルテ・備忘録 】";

                const wrap = document.createElement("div");
                wrap.className = "file-item-wrap";
                wrap.innerHTML = `
                    <div class="file-row">
                        <div class="row-left">
                            <span class="subj-tag">${item.tag}</span>
                            <span class="subj-title">${item.name}</span>
                        </div>
                        <div class="row-right">
                            <button class="view-btn btn-memo-toggle ${hasData ? 'has-data' : ''}" onclick="toggleMemo('${item.id}')">${memoBtnLabel}</button>
                            <button class="view-btn btn-split" onclick="openSplitViewer('${section.name}・${item.name}', '${item.qFile}', '${item.aFile}')">並べて表示</button>
                            <button class="view-btn btn-question" onclick="openSingleViewer('${section.name}・${item.name} [問題]', '${item.qFile}', '[問題]')">問題</button>
                            <button class="view-btn btn-answer" onclick="openSingleViewer('${section.name}・${item.name} [解答]', '${item.aFile}', '[模範解答]')">解答</button>
                            <a href="${item.qFile}" download class="view-btn btn-download" title="ダウンロード">DL問</a>
                            <a href="${item.aFile}" download class="view-btn btn-download" title="ダウンロード">DL解</a>
                        </div>
                    </div>
                    <!-- 個人カルテ（メモ枠） -->
                    <div class="memo-drawer" id="memo-drawer-${item.id}">
                        <div class="memo-drawer-header">
                            <span style="font-weight:bold; color:var(--text-main);">${memoDrawerTitle}</span>
                            <div class="memo-inputs">
                                <span>得点:</span>
                                <input type="number" class="memo-score-input" min="0" max="100" placeholder="--" value="${memo.score}" onchange="updateMemoField('${item.id}', 'score', this.value)">
                                <span>/ 100点</span>
                                <select class="memo-status-select" onchange="updateMemoField('${item.id}', 'status', this.value)">
                                    <option value="未着手" ${memo.status === '未着手' ? 'selected' : ''}>未着手</option>
                                    <option value="演習済" ${memo.status === '演習済' ? 'selected' : ''}>演習済</option>
                                    <option value="要解き直し" ${memo.status === '要解き直し' ? 'selected' : ''}>要解き直し</option>
                                    <option value="完璧" ${memo.status === '完璧' ? 'selected' : ''}>完璧</option>
                                </select>
                                <span class="memo-date-stamp">${memo.date ? '実施日: ' + memo.date : ''}</span>
                            </div>
                        </div>
                        <textarea class="memo-textarea" placeholder="間違えた問題、反省点、次回解く時の注意点などをメモ（入力時に自動保存されます）" oninput="updateMemoField('${item.id}', 'text', this.value)">${memo.text}</textarea>
                    </div>
                `;
                table.appendChild(wrap);
            });

            details.appendChild(table);
            root.appendChild(details);
        });

        document.getElementById("filteredCount").textContent = `表示中: ${matchCount} 項目`;
        document.getElementById("noRecords").style.display = matchCount === 0 ? "block" : "none";
    }

    /* ── カルテ操作 ── */
    window.toggleMemo = function(id) {
        const drawer = document.getElementById(`memo-drawer-${id}`);
        drawer.classList.toggle("open");
    };

    window.updateMemoField = function(id, field, value) {
        if (!userMemos[id]) {
            userMemos[id] = { score: "", status: "未着手", date: "", text: "" };
        }
        userMemos[id][field] = value.trim();

        if (!userMemos[id].date) {
            const d = new Date();
            userMemos[id].date = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
        }

        saveMemos();
    };

    /* ═══════════════════════════════════════════════════════════════════
       📐 プレビューモーダル & 演習引き出しサイドバー & 手書き機能
       ═══════════════════════════════════════════════════════════════════ */
    const modal = document.getElementById("viewerModal");
    const sidebar = document.getElementById("viewerSidebar");
    const toggleSidebarBtn = document.getElementById("toggleSidebarBtn");
    const toggleDrawBtn = document.getElementById("toggleDrawBtn");
    const clearCanvasBtn = document.getElementById("clearCanvasBtn");

    let isDrawingMode = false;
    let currentColor = "#e11d48";
    let isEraser = false;

    // サイドバー開閉
    toggleSidebarBtn.addEventListener("click", () => {
        sidebar.classList.toggle("open");
    });

    // 手書きモードON/OFF
    toggleDrawBtn.addEventListener("click", () => {
        isDrawingMode = !isDrawingMode;
        modal.classList.toggle("draw-mode-active", isDrawingMode);
        toggleDrawBtn.textContent = isDrawingMode ? "✎ 手書き: ON" : "✎ 手書き: OFF";
        toggleDrawBtn.style.background = isDrawingMode ? "var(--accent)" : "var(--surface)";
        toggleDrawBtn.style.color = isDrawingMode ? "var(--bg)" : "var(--text-main)";
    });

    // ペンパレット操作
    document.querySelectorAll(".color-dot").forEach(dot => {
        dot.addEventListener("click", (e) => {
            document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
            e.target.classList.add("active");
            currentColor = e.target.dataset.color;
            isEraser = false;
            document.getElementById("eraserBtn").style.background = "none";
        });
    });

    document.getElementById("eraserBtn").addEventListener("click", () => {
        isEraser = true;
        document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
        document.getElementById("eraserBtn").style.background = "var(--text-main)";
        document.getElementById("eraserBtn").style.color = "var(--bg)";
    });

    // キャンバス描画エンジン
    function setupCanvas(canvas) {
        const ctx = canvas.getContext("2d");
        let painting = false;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - 31;
        }

        window.addEventListener("resize", resizeCanvas);
        setTimeout(resizeCanvas, 100);

        function startPosition(e) {
            if (!isDrawingMode) return;
            painting = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting || !isDrawingMode) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineWidth = isEraser ? 18 : 3;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (isEraser) {
                ctx.globalCompositeOperation = "destination-out";
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener("mousedown", startPosition);
        canvas.addEventListener("mouseup", endPosition);
        canvas.addEventListener("mousemove", draw);

        canvas.addEventListener("touchstart", startPosition, { passive: true });
        canvas.addEventListener("touchend", endPosition);
        canvas.addEventListener("touchmove", draw, { passive: true });

        return ctx;
    }

    const ctxLeft = setupCanvas(document.getElementById("canvasLeft"));
    const ctxRight = setupCanvas(document.getElementById("canvasRight"));

    clearCanvasBtn.addEventListener("click", () => {
        const c1 = document.getElementById("canvasLeft");
        const c2 = document.getElementById("canvasRight");
        ctxLeft.clearRect(0, 0, c1.width, c1.height);
        ctxRight.clearRect(0, 0, c2.width, c2.height);
    });

    /* ── サイドバー内 50分試験タイマー ── */
    let sidebarTimerSec = 50 * 60;
    let sidebarTimerInterval = null;
    const sidebarTimerDisplay = document.getElementById("sidebarTimerDisplay");
    const sidebarTimerToggleBtn = document.getElementById("sidebarTimerToggleBtn");
    const sidebarTimerResetBtn = document.getElementById("sidebarTimerResetBtn");

    function renderSidebarTimer() {
        const m = String(Math.floor(sidebarTimerSec / 60)).padStart(2, "0");
        const s = String(sidebarTimerSec % 60).padStart(2, "0");
        sidebarTimerDisplay.textContent = `${m}:${s}`;
    }

    sidebarTimerToggleBtn.addEventListener("click", () => {
        if (sidebarTimerInterval) {
            clearInterval(sidebarTimerInterval);
            sidebarTimerInterval = null;
            sidebarTimerToggleBtn.textContent = "再開";
        } else {
            sidebarTimerToggleBtn.textContent = "停止";
            sidebarTimerInterval = setInterval(() => {
                if (sidebarTimerSec > 0) {
                    sidebarTimerSec--;
                    renderSidebarTimer();
                } else {
                    clearInterval(sidebarTimerInterval);
                    sidebarTimerInterval = null;
                    sidebarTimerToggleBtn.textContent = "終了";
                    alert("【試験時間終了】50分が経過しました。演習お疲れ様でした！");
                }
            }, 1000);
        }
    });

    sidebarTimerResetBtn.addEventListener("click", () => {
        clearInterval(sidebarTimerInterval);
        sidebarTimerInterval = null;
        sidebarTimerSec = 50 * 60;
        sidebarTimerToggleBtn.textContent = "開始";
        renderSidebarTimer();
    });

    /* ── プレビュー制御 ── */
    window.openSplitViewer = function(title, qFile, aFile) {
        modal.classList.remove("single-mode");
        modal.classList.add("split-mode");

        document.getElementById("viewerSubjectTitle").textContent = title;
        document.getElementById("paneLeftTitle").textContent = "[問題]";
        document.getElementById("frameQuestion").src = qFile + "#toolbar=0&navpanes=0";
        document.getElementById("frameAnswer").src = aFile + "#toolbar=0&navpanes=0";

        modal.classList.add("open");
        addRecent(title, qFile, aFile);
    };

    window.openSingleViewer = function(title, file, label) {
        modal.classList.remove("split-mode");
        modal.classList.add("single-mode");

        document.getElementById("viewerSubjectTitle").textContent = title;
        document.getElementById("paneLeftTitle").textContent = label;
        document.getElementById("frameQuestion").src = file + "#toolbar=0&navpanes=0";
        document.getElementById("frameAnswer").src = "";

        modal.classList.add("open");
    };

    function closeViewer() {
        modal.classList.remove("open");
        sidebar.classList.remove("open");
        document.getElementById("frameQuestion").src = "";
        document.getElementById("frameAnswer").src = "";
    }

    document.getElementById("closeViewerBtn").addEventListener("click", closeViewer);
    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeViewer();
    });

    // カウントダウン
    function updateCountdown() {
        if (!state.targetDate) {
            document.getElementById("daysRemain").textContent = "--";
            return;
        }
        const target = new Date(state.targetDate + "T00:00:00");
        const today = new Date();
        today.setHours(0,0,0,0);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        document.getElementById("daysRemain").textContent = diff >= 0 ? diff : "終了";
    }

    document.getElementById("yearSelect").addEventListener("change", (e) => {
        selectedYear = e.target.value;
        renderArchive();
    });
    document.getElementById("gradeSelect").addEventListener("change", (e) => {
        selectedGrade = e.target.value;
        renderArchive();
    });
    document.getElementById("searchInput").addEventListener("input", (e) => {
        searchKeyword = e.target.value.trim();
        renderArchive();
    });

    document.querySelectorAll("[data-term]").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll("[data-term]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            selectedTerm = btn.dataset.term;
            renderArchive();
        });
    });

    document.querySelectorAll("[data-cat]").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll("[data-cat]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            selectedCat = btn.dataset.cat;
            renderArchive();
        });
    });

    document.getElementById("expandAll").addEventListener("click", () => {
        document.querySelectorAll(".exam-section").forEach(s => s.open = true);
    });
    document.getElementById("collapseAll").addEventListener("click", () => {
        document.querySelectorAll(".exam-section").forEach(s => s.open = false);
    });

    const dialog = document.getElementById("dateDialog");
    const dateField = document.getElementById("dateField");
    document.getElementById("setDateBtn").addEventListener("click", () => {
        dateField.value = state.targetDate || "";
        dialog.classList.add("open");
    });
    document.getElementById("cancelDateBtn").addEventListener("click", () => {
        dialog.classList.remove("open");
    });
    document.getElementById("saveDateBtn").addEventListener("click", () => {
        state.targetDate = dateField.value;
        saveState();
        updateCountdown();
        dialog.classList.remove("open");
    });

    const now = new Date();
    document.getElementById("currentDateDisplay").textContent = 
        `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;

    // 起動時セッション確認
    (function checkSession() {
        const savedRole = sessionStorage.getItem("exam_auth_role");
        if (["admin", "physics", "viewer"].includes(savedRole)) {
            currentUserRole = savedRole;
            grantAccess();
        }
    })();
</script>
